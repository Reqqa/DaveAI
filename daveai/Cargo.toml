[package]
name = "daveai"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime and Web Server framework
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"                  # Blazing fast, ergonomic web framework by the Tokio team

# Serialization/Deserialization (Crucial for parsing raw JSON webhooks)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database Connectivity (Supabase / Postgres)
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid"] }

# HTTP Client for firing outbound requests to Slack and Supervity APIs
reqwest = { version = "0.12", features = ["json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] } # Precise event timestamping
dotenvy = "0.15"              # Easy local loading of secure .env files
uuid = { version = "1.0", features = ["serde", "v4"] }
